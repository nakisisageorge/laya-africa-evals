[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-africa-evals"
description = "Independent evaluation suite for the laya System-1 decision engine"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "George Nakisisa", email = "nakisisageorge@gmail.com"}
]
keywords = ["laya", "evaluation", "AI", "decision-engine", "african-languages"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/nakisisageorge/laya-africa-evals"
Repository = "https://github.com/nakisisageorge/laya-africa-evals"
Issues = "https://github.com/nakisisageorge/laya-africa-evals/issues"

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
laya_africa_evals = ["data/*", "templates/*"]